name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            preset: ci-win-debug
          - os: windows-latest
            preset: ci-win-release
          - os: ubuntu-latest
            preset: debug-linux
          - os: ubuntu-latest
            preset: release-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }} --output-on-failure
      - name: Engine latency
        if: contains(matrix.preset, 'debug')
        run: ${{ matrix.preset == 'ci-win-debug' && 'build/ci-win-debug/tools/latency/Debug/engine_latency.exe' || 'build/debug-linux/tools/latency/engine_latency' }}
